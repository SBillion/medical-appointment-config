# Production environment overrides for medical-appointment.
#
# The image tags below are updated automatically by the Release workflow in
# the medical-appointment application repository. A single stacked deploy PR
# ("deploy/production-pending" -> main) is kept open and bumped to the latest
# commit SHA on main until it is merged (manual approval gate).

image:
  backend:
    repository: ghcr.io/sbillion/medical-appointment-backend
    tag: "337385658dac55744cd71683bcd28f9bcb800b5f"
    pullPolicy: Always
  frontend:
    repository: ghcr.io/sbillion/medical-appointment-frontend
    tag: "337385658dac55744cd71683bcd28f9bcb800b5f"
    pullPolicy: Always
replicaCount: 2
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: medical-appointment.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: medical-appointment-tls
      hosts:
        - medical-appointment.example.com
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
backend:
  env:
    DATABASE_URL: "postgresql+asyncpg://app:app@postgres:5432/medical_appointment"
    CORS_ORIGINS: '["https://medical-appointment.example.com"]'
frontend:
  env:
    VITE_API_BASE_URL: "https://medical-appointment.example.com/api"
resources:
  backend:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  frontend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
postgres:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  persistence:
    size: 10Gi
