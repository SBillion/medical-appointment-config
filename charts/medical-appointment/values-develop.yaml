# Development environment overrides
replicaCount: 1

image:
  backend:
    repository: medical-appointment-backend
    tag: local
    pullPolicy: Never
  frontend:
    repository: medical-appointment-frontend
    tag: local
    pullPolicy: Never

ingress:
  enabled: true
  hosts:
    - host: medical-appointment.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

autoscaling:
  enabled: false

resources:
  backend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  frontend:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi