apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medical-appointment-develop
  namespace: argocd
  labels:
    app: medical-appointment
    environment: develop
spec:
  project: default
  source:
    repoURL: https://github.com/SBillion/medical-appointment-config.git
    targetRevision: develop
    path: charts/medical-appointment
    helm:
      valueFiles:
        - values-develop.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medical-appointment-develop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m