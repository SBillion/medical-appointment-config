apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medical-appointment-production
  namespace: argocd
  labels:
    app: medical-appointment
    environment: production
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=ghcr.io/sbillion/medical-appointment-backend,frontend=ghcr.io/sbillion/medical-appointment-frontend
    argocd-image-updater.argoproj.io/backend.update-strategy: semver
    argocd-image-updater.argoproj.io/frontend.update-strategy: semver
    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^v?[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^v?[0-9]+\.[0-9]+\.[0-9]+$
spec:
  project: default
  source:
    repoURL: https://github.com/SBillion/medical-appointment-config.git
    targetRevision: main
    path: charts/medical-appointment
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medical-appointment-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    managedNamespaceMetadata:
      labels:
        environment: production
        app: medical-appointment