name: Update ArgoCD Applications

on:
  push:
    branches:
      - main
    paths:
      - "envs/**"
      - "apps/**"

jobs:
  trigger-argocd-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed applications
        id: apps
        run: |
          echo "sync_development=false" >> "$GITHUB_OUTPUT"
          echo "sync_production=false" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || true)
          echo "$files"
          if echo "$files" | grep -qE '^envs/development/'; then
            echo "sync_development=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^envs/production/'; then
            echo "sync_production=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: Configure ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} --username ${{ secrets.ARGOCD_USERNAME }} --password ${{ secrets.ARGOCD_PASSWORD }} --insecure

      - name: Sync development
        if: steps.apps.outputs.sync_development == 'true'
        run: |
          argocd app sync medical-appointment-development --async
          argocd app wait medical-appointment-development --timeout 300s --health
          echo "✅ Synced medical-appointment-development"

      - name: Sync production
        if: steps.apps.outputs.sync_production == 'true'
        run: |
          argocd app sync medical-appointment-production --async
          argocd app wait medical-appointment-production --timeout 300s --health
          echo "✅ Synced medical-appointment-production"
