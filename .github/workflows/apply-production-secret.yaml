name: Apply production secret

on:
  workflow_dispatch:

jobs:
  apply:
    name: Apply postgres-credentials secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3

      - name: Apply secret
        run: |
          kubectl create secret generic postgres-credentials \
            --namespace medical-appointment-production \
            --from-literal=postgres-user="${{ secrets.POSTGRES_USER }}" \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=database-url="postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/medical_appointment" \
            --dry-run=client -o yaml | kubectl apply -f -
